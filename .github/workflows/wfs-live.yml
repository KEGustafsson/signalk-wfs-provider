name: Live WFS Integration
on:
  schedule:
    - cron: '0 2 * * *'
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm test
        env:
          WFS_LIVE: 'true'
